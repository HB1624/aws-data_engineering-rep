AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Lambda function stack - execution role, log group, and function.
  Code is deployed from an S3 bucket

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, qa, prod]
    Default: dev
    Description: Deployment environment name

  FunctionName:
    Type: String
    Description: Base name of the Lambda function (env will be appended)

  Runtime:
    Type: String
    Default: python3.12
    Description: Lambda runtime

  Handler:
    Type: String
    Default: graph_analytics_lambda.handler
    Description: Lambda handler (file.function)

  MemorySize:
    Type: Number
    Default: 256
    MinValue: 128
    MaxValue: 10240

  Timeout:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 900

  LogRetentionInDays:
    Type: Number
    Default: 14

  CodeS3Bucket:
    Type: String
    Description: S3 bucket that holds the packaged Lambda deployment zip

  CodeS3Key:
    Type: String
    Description: S3 key (path) of the packaged Lambda deployment zip

  ExtraManagedPolicyArns:
    Type: CommaDelimitedList
    Default: ""

Conditions:
  HasExtraPolicies: !Not [!Equals [!Join ["", !Ref ExtraManagedPolicyArns], ""]]

Resources:

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FunctionName}-${Environment}"
      RetentionInDays: !Ref LogRetentionInDays

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${FunctionName}-${Environment}-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        !If
          - HasExtraPolicies
          - !Ref ExtraManagedPolicyArns
          - !Ref "AWS::NoValue"
      Policies:
        - PolicyName: !Sub "${FunctionName}-${Environment}-logging"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt LambdaLogGroup.Arn

  LambdaFunction:
    Type: AWS::Lambda::Function
    DependsOn: LambdaLogGroup
    Properties:
      FunctionName: !Sub "${FunctionName}-${Environment}"
      Runtime: !Ref Runtime
      Handler: !Ref Handler
      Role: !GetAtt LambdaExecutionRole.Arn
      MemorySize: !Ref MemorySize
      Timeout: !Ref Timeout
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  FunctionArn:
    Description: ARN of the deployed Lambda function
    Value: !GetAtt LambdaFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-FunctionArn"

  FunctionName:
    Description: Name of the deployed Lambda function
    Value: !Ref LambdaFunction

  ExecutionRoleArn:
    Description: ARN of the Lambda execution role
    Value: !GetAtt LambdaExecutionRole.Arn
